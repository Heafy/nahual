services:
  - type: web
    runtime: static
    name: nahual-lsm
    buildCommand: python3 web/browser/build.py
    staticPublishPath: ./web/dist
    # branch: main   # uncomment / change to the branch that holds web/browser/
    # The app pulls Pyodide + MediaPipe from a CDN and needs no special
    # cross-origin-isolation headers (it is single-threaded), so no headers
    # block is required here.
